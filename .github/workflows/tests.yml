name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Lint
        run: |
          php -l global.inc.php
          php -l playground.php
          for file in tests/*.php; do php -l "$file"; done

      - name: Test
        run: composer test
