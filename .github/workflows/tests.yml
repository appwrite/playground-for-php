name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Lint and smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      - name: Lint
        run: |
          php -l global.inc.php
          php -l playground.php
          php -l tests/smoke.php
          php -l tests/stub-server.php

      - name: Smoke test
        run: php tests/smoke.php
