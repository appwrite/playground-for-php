services:
  playground-for-php:
    build: .
    # Mount the files worth editing rather than the whole directory, so the
    # dependencies installed into the image stay in place.
    volumes:
      - "./playground.php:/app/playground.php"
      - "./global.inc.php:/app/global.inc.php"
    environment:
      - APPWRITE_ENDPOINT
      - APPWRITE_PROJECT_ID
      - APPWRITE_API_KEY
    command: "php playground.php"
